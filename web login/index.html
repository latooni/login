<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swaggot</title>
    <style>
        body {
            height: 80vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .user {
            width: 200px;
            height: 200px;
        }

        .login-section {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .login-section label {
            color: #fff;
            margin-bottom: 6px;
            align-self: flex-start;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .login-section input {
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            width: 200px;
            background: #000;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .login-section input:focus {
            border: 1.5px solid #fff;
        }

        .login-section input::placeholder {
            color: #fff;
            opacity: 1;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .login-section button {
            padding: 10px 24px;
            border-radius: 6px;
            border: 1px solid grey;
            background: #000;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, color 0.2s;
        }

        .login-section button:hover {
            background: #fff;
            color: #000;
        }

        .error-message {
            color: #ff4d4d;
            margin-bottom: 12px;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>
    <img class="user" src="./imgs/user.png" alt="User Image">
    <form class="login-section" id="loginForm" autocomplete="off">
        <div class="error-message" id="errorMsg">Invalid.</div>
        <input type="text" id="username" name="username" required placeholder="x" autocomplete="off">
        <input type="password" id="password" name="password" required placeholder="x" autocomplete="off">
        <button type="submit">Login</button>
    </form>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username === 'get out' && password === 'GET OUT') {
                // Redirect or show "logged in" content
                window.location.href = "welcome.html"; // Change to your protected page
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
